name: Benchmark

# Optional large-scale smoke benchmark — not run on every PR push.
# Weekly schedule uses --quick; workflow_dispatch can request full 250K scale.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: Benchmark scale
        required: false
        default: quick
        type: choice
        options:
          - quick
          - full
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  PYTHONPATH: src

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --frozen --no-build --no-install-project --extra dev
      - name: Run benchmark smoke test
        id: benchmark
        env:
          SCALE: ${{ github.event.inputs.scale || 'quick' }}
        run: |
          OUTPUT="benchmark-output.txt"
          if [ "$SCALE" = "full" ]; then
            uv run --no-sync --no-build python -m garland.benchmark \
              --n-agents 250000 \
              --n-steps 20 \
              --check \
              --output "$OUTPUT"
          else
            uv run --no-sync --no-build python -m garland.benchmark \
              --quick \
              --check \
              --output "$OUTPUT"
          fi
      - name: Upload benchmark output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-output
          path: benchmark-output.txt
