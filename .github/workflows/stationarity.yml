name: Stationarity Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  stationarity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install package and test dependencies
        run: uv sync --frozen --extra dev
      - name: Run null-baseline stationarity sentinel
        run: uv run pytest tests/test_stationarity.py -v -m slow
