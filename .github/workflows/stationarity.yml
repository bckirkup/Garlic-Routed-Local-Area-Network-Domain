name: Stationarity Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  stationarity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install package and test dependencies
        run: uv sync --frozen --no-build --no-install-project --extra dev
      - name: Run null-baseline stationarity sentinel
        run: PYTHONPATH=src uv run --no-sync --no-build --no-project pytest tests/test_stationarity.py -v -m slow
