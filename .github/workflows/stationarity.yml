name: Stationarity Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  stationarity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Run null-baseline stationarity sentinel
        run: python -m pytest tests/test_stationarity.py -v -m slow
