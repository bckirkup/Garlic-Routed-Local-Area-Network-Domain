# Small-community detection-power scenario: a mixed-modality fleet observed
# through a staged plume and a staged outbreak, with the drop-one-channel
# diagnostic on. Read the `detection_power` block of the summary: width-bucketed
# TPR/FPR/latency, per-subsystem reporting yield, and per-channel marginal
# contribution.
#
# This is the bottom rung of the population ladder (see
# examples/detection_power_ladder_sweep.yaml); it is deliberately small enough to run
# on a laptop before anything city-scale.
n_agents: 2000
n_steps: 1728
wearable_fraction: 0.15
seed: 42
mobility_model: random_walk
world_settling_steps: 288

grid_width: 2000.0
grid_height: 2000.0
cell_size: 200.0

anomaly_threshold: 3.5
baseline_decay_lambda: 0.01
baseline_seasonal_decay: 0.001

# Adoption is per subsystem, and the fractions descend with device cost, so the
# fleet spans every width bucket rather than sitting at one width.
devices:
  enabled: true
  adoption:
    motion_actigraphy: 0.55
    instrumented_footwear: 0.20
    respiratory_acoustic_patch: 0.12
    chest_electrode_patch: 0.08
    headband_eeg: 0.06
    thoracic_eit_acoustic_band: 0.03
    abdominal_acoustic_band: 0.03

device_lifecycle:
  enabled: true

# Sampling one alarm in five keeps the ablation's extra Mahalanobis evaluations
# a small share of the run.
detection_power:
  channel_ablation_rate: 0.2

seir:
  beta: 0.015
  initial_infected: 0
  outbreaks:
    - outbreak_id: staged_outbreak
      start_step: 1152
      initial_infected: 20
      center_x: 1000.0
      center_y: 1000.0
      seed_radius: 300.0

plumes:
  - plume_id: staged_plume
    source_x: 1000.0
    source_y: 1000.0
    release_rate: 200.0
    wind_speed: 1.0
    wind_direction: 0.0
    stability_class: D
    start_step: 864
    duration_steps: 288

privacy:
  threshold_m: 5
  k_min: 10
  time_window_steps: 12
  epsilon_per_response: 0.1
  randomized_response_p: 0.75
  laplace_scale: 200.0
  dummy_rate: 0.01

attacks:
  active_attacks: []
