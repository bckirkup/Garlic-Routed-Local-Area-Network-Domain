# Exurb/commuter town: sparse, spread out, and privacy-limited.
# What it tests: k-anonymity dilution over sparse cells.
# TODO: add school return, outage/heat, highway standing, and seasonal ILI events.
n_agents: 2000
grid_width: 12000.0
grid_height: 12000.0
cell_size: 200.0
wearable_fraction: 0.20
households_per_neighborhood: 90
# Authored mean 3.4 rounded to 3 because household construction uses an integer chunk size.
household_size_mean: 3
mobility_model: schedule
n_steps: 1152
seed: 42
start_datetime: "2024-07-15T00:00:00"
world_settling_steps: 288

seir:
  initial_infected: 0
  outbreaks: []

plumes: []

confounders:
  enabled: true
  elderly_fraction: 0.18
  has_air_conditioning_fraction: 0.85
  outdoor_worker_fraction: 0.09
  endurance_athlete_fraction: 0.10
  heat_island_gain: 0.12
  exercise_rate: 0.015
  sleep_disruption_rate: 0.05
  venue_crowding_rate: 0.02
  background_ili_daily_incidence: 0.0025
  background_ili_secondary_probability: 0.18

venues:
  enabled: true
  calibration_preset: us_suburban
  use_proximity_contacts: true
  use_venue_contacts: true
  venues:
    - venue_id: exurb_school
      venue_type: school
      center_x: 2800.0
      center_y: 3400.0
      radius: 350.0
      capacity: 800
      contact_multiplier: 3.2
      schedule:
        weekdays: [0, 1, 2, 3, 4]
        start_hour: 7.5
        end_hour: 16.0
    - venue_id: highway_big_box
      venue_type: shopping
      center_x: 6000.0
      center_y: 5000.0
      radius: 300.0
      capacity: 500
      contact_multiplier: 2.1
      schedule:
        start_hour: 9.0
        end_hour: 21.0
    - venue_id: commuter_plant_a
      venue_type: workplace
      center_x: 11400.0
      center_y: 11200.0
      radius: 300.0
      capacity: 700
      contact_multiplier: 2.8
      schedule:
        weekdays: [0, 1, 2, 3, 4]
        start_hour: 6.0
        end_hour: 19.0
    - venue_id: commuter_plant_b
      venue_type: workplace
      center_x: 10800.0
      center_y: 11600.0
      radius: 240.0
      capacity: 500
      contact_multiplier: 2.8
      schedule:
        weekdays: [0, 1, 2, 3, 4]
        start_hour: 6.0
        end_hour: 19.0
