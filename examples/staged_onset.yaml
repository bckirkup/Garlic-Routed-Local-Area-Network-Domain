# Staged hazard scenario for onset-to-alert measurements.
# The 576-step warm-in precedes either hazard so baseline behavior is observed
# before the plume at step 864 and outbreak at step 1152.
n_agents: 10000
n_steps: 1728
wearable_fraction: 0.15
seed: 42
mobility_model: static

grid_width: 2000.0
grid_height: 2000.0
cell_size: 200.0

anomaly_threshold: 3.5
baseline_decay_lambda: 0.01
baseline_seasonal_decay: 0.001

seir:
  beta: 0.015
  initial_infected: 0
  outbreaks:
    - outbreak_id: staged_outbreak
      start_step: 1152
      initial_infected: 50
      center_x: 1000.0
      center_y: 1000.0
      seed_radius: 300.0

# This release rate was selected because it exposes a non-trivial population
# above GARLAND's 0.01 concentration threshold in this fixed geometry.
plumes:
  - plume_id: staged_plume
    source_x: 1000.0
    source_y: 1000.0
    release_rate: 5.0
    wind_speed: 1.0
    wind_direction: 0.0
    stability_class: D
    start_step: 864
    duration_steps: 288

privacy:
  threshold_m: 5
  k_min: 10
  time_window_steps: 12
  epsilon_per_response: 0.1
  randomized_response_p: 0.75
  laplace_scale: 200.0
  dummy_rate: 0.01

attacks:
  active_attacks: []
