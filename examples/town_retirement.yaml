# Retirement/snowbird town: high susceptibility paired with high device density.
# What it tests: best-case detection under consequential benign illness.
# TODO: add heat-plus-outage, endemic ILI, and clinic vaccination-day events.
n_agents: 1500
grid_width: 5000.0
grid_height: 5000.0
cell_size: 200.0
wearable_fraction: 0.35
households_per_neighborhood: 200
# Authored mean 1.9 rounded to 2 because household construction uses an integer chunk size.
household_size_mean: 2
mobility_model: schedule
n_steps: 1152
seed: 42
start_datetime: "2024-07-15T00:00:00"
world_settling_steps: 288

seir:
  initial_infected: 0
  outbreaks: []

plumes: []

confounders:
  enabled: true
  elderly_fraction: 0.65
  has_air_conditioning_fraction: 0.90
  outdoor_worker_fraction: 0.03
  endurance_athlete_fraction: 0.06
  heat_island_gain: 0.22
  exercise_rate: 0.012
  sleep_disruption_rate: 0.04
  venue_crowding_rate: 0.04
  background_ili_daily_incidence: 0.005
  background_ili_secondary_probability: 0.15

venues:
  enabled: true
  calibration_preset: weekend_leisure
  use_proximity_contacts: true
  use_venue_contacts: true
  venues:
    - venue_id: retirement_hospital
      venue_type: hospital
      center_x: 2500.0
      center_y: 2600.0
      radius: 260.0
      capacity: 500
      contact_multiplier: 4.5
    - venue_id: retirement_market
      venue_type: shopping
      center_x: 3300.0
      center_y: 1800.0
      radius: 300.0
      capacity: 500
      contact_multiplier: 2.2
      schedule:
        start_hour: 8.0
        end_hour: 20.0
    - venue_id: clubhouse
      venue_type: third_place
      center_x: 1500.0
      center_y: 1500.0
      radius: 120.0
      capacity: 250
      contact_multiplier: 2.0
      schedule:
        start_hour: 8.0
        end_hour: 22.0
    - venue_id: golf_cafe
      venue_type: third_place
      center_x: 3900.0
      center_y: 3000.0
      radius: 100.0
      capacity: 160
      contact_multiplier: 2.0
      schedule:
        start_hour: 7.0
        end_hour: 21.0
    - venue_id: community_school
      venue_type: school
      center_x: 1200.0
      center_y: 3400.0
      radius: 180.0
      capacity: 250
      contact_multiplier: 3.0
      schedule:
        weekdays: [0, 1, 2, 3, 4]
        start_hour: 8.0
        end_hour: 16.0
