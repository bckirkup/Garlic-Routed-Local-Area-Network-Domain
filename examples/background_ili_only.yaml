# Background ILI-only confounder scenario.
n_agents: 10000
n_steps: 2016
wearable_fraction: 0.15
seed: 42
mobility_model: static

grid_width: 2000.0
grid_height: 2000.0
cell_size: 200.0
anomaly_threshold: 3.5
baseline_decay_lambda: 0.01
baseline_seasonal_decay: 0.001

seir:
  beta: 0.015
  initial_infected: 0
  outbreaks: []
plumes: []

background_ili:
  enabled: true
  onset_probability_per_step: 0.0001
  duration_steps: 288
  household_secondary_multiplier: 4.0
  seasonal_amplitude: 0.5
  severity_log_sigma: 0.25

cooking_irritants:
  enabled: false

privacy:
  threshold_m: 5
  k_min: 10
  time_window_steps: 12
  epsilon_per_response: 0.1
  randomized_response_p: 0.75
  laplace_scale: 200.0
  dummy_rate: 0.01

attacks:
  active_attacks: []
