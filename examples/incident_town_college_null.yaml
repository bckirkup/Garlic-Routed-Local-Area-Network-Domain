# The complex-world null: the incident_town_college world with no target
# hazard staged.
#
# This is `examples/incident_town_college.yaml` with the toxin plume and the
# disease outbreak removed and nothing else changed: the same college-town
# geometry and venues, the same schedule mobility, the same heterogeneous
# demographic fleet at 0.85 adoption, and the same six-day benign calendar —
# the victory wave, the whole-day heat advisory, the block fire, and every
# chronic confounder (exercise, sleep disruption, sensor artifacts, venue
# crowding, background ILI) all still run.
#
# Every broadcast this scenario issues is therefore a false alarm by
# construction. It is the false-alarm denominator for the incident scenario:
# the committed simple-world null baseline (`examples/null_baseline.yaml`)
# measures the detector floor in an empty world, while this one measures the
# alarm load an operator would actually carry in the complex world before any
# real incident happens. Run it at several seeds (`--seed 42/43/44`) — daily
# broadcast counts in this family are seed-sensitive.
n_agents: 3000
grid_width: 4000.0
grid_height: 4000.0
cell_size: 200.0
wearable_fraction: 0.85
households_per_neighborhood: 260
household_size_mean: 4
mobility_model: schedule
n_steps: 1728
seed: 42
start_datetime: "2024-07-15T00:00:00"
world_settling_steps: 288

anomaly_threshold: 3.5
baseline_decay_lambda: 0.01
baseline_seasonal_decay: 0.001

# The heterogeneous fleet: age structure drives who owns what, and a
# long-tailed per-person enthusiasm factor spreads device counts across people.
demographics:
  enabled: true
  household_type_fractions:
    family: 0.34
    adult_only: 0.46
    senior: 0.20
  infant_share_of_children: 0.22
  elderly_share_of_seniors: 0.35
  base_device_retention:
    infant: 0.80
    child: 0.92
    adult: 1.0
    older_adult: 1.0
    elderly: 0.90
  enthusiasm_sigma: 0.8

devices:
  enabled: true
  adoption:
    # ≈40% of the 10% diabetic pool wears one.
    cgm_patch: 0.04
    motion_actigraphy: 0.55
    instrumented_footwear: 0.20
    respiratory_acoustic_patch: 0.12
    chest_electrode_patch: 0.08
    headband_eeg: 0.06
    thoracic_eit_acoustic_band: 0.03
    abdominal_acoustic_band: 0.03
    wrist_eda_module: 0.12
    # Hearables are need/role-gated; realized owners come from the eligible ~10% pool.
    hearable: 0.05

hosts:
  enabled: true

device_lifecycle:
  enabled: true

# Nothing is staged before the alarm scales freeze at step 720, so deferring
# broadcasts until the freeze costs no incident and drops the pre-freeze
# triggers minted from cuts the run was still establishing.
alarm_calibration:
  defer_broadcasts_until_frozen: true

detection_power:
  channel_ablation_rate: 0.2


# No target hazards: an explicitly empty plume list and a SEIR block that
# seeds nothing, so the defaults cannot quietly reintroduce either hazard.
seir:
  beta: 0.015
  initial_infected: 0
  outbreaks: []

plumes: []

confounders:
  enabled: true
  elderly_fraction: 0.08
  has_air_conditioning_fraction: 0.60
  outdoor_worker_fraction: 0.06
  endurance_athlete_fraction: 0.18
  heat_island_gain: 0.30
  exercise_rate: 0.020
  sleep_disruption_rate: 0.09
  venue_crowding_rate: 0.05
  background_ili_daily_incidence: 0.004
  background_ili_secondary_probability: 0.25
  # Day 3: a broad, simultaneous, exposure-weighted heat advisory.
  heat_wave_start_step: 576
  heat_wave_duration_steps: 288
  # Day 2, 18:00: the campus victory wave.
  victory_fan_fraction: 0.55
  victory_start_step: 504
  victory_duration_steps: 36
  # Day 5, 12:00: a three-hour block fire in the northeast residential blocks.
  # Sited at (2800, 3000) rather than the original (2100, 3300): the
  # stadium-adjacent siting realized zero material exposure (see
  # examples/incident_town_college.yaml for the full rationale).
  block_fire_start_step: 1296
  block_fire_duration_steps: 36
  block_fire_center_x: 2800.0
  block_fire_center_y: 3000.0
  block_fire_radius_m: 150.0

venues:
  enabled: true
  calibration_preset: college_town
  use_proximity_contacts: true
  use_venue_contacts: true
  venues:
    - venue_id: university
      venue_type: school
      center_x: 2000.0
      center_y: 1900.0
      radius: 500.0
      capacity: 1800
      contact_multiplier: 3.2
      schedule:
        weekdays: [0, 1, 2, 3, 4]
        start_hour: 8.0
        end_hour: 18.0
    - venue_id: campus_stadium
      venue_type: sporting_event
      center_x: 2100.0
      center_y: 3100.0
      radius: 300.0
      capacity: 1200
      contact_multiplier: 4.0
      schedule:
        weekdays: [4, 5]
        start_hour: 17.0
        end_hour: 23.0
    - venue_id: main_street_bar
      venue_type: third_place
      center_x: 1500.0
      center_y: 1500.0
      radius: 80.0
      capacity: 180
      contact_multiplier: 2.2
      schedule:
        start_hour: 16.0
        end_hour: 2.0
    - venue_id: campus_cafe
      venue_type: third_place
      center_x: 1800.0
      center_y: 1450.0
      radius: 65.0
      capacity: 120
      contact_multiplier: 1.9
      schedule:
        start_hour: 7.0
        end_hour: 22.0
    - venue_id: arts_cafe
      venue_type: third_place
      center_x: 1300.0
      center_y: 1700.0
      radius: 70.0
      capacity: 100
      contact_multiplier: 1.9
      schedule:
        start_hour: 10.0
        end_hour: 23.0

# The calibrated aggregation operating point from
# examples/detection_power_town.yaml: threshold_m 8 was the knee of the
# trigger-count sweep there.
# Advisories are assembled on each device from local anomaly signals and
# privacy-preserving public confirmations, so contributors and non-contributors
# can both benefit.
advisories:
  enabled: true
  clinic_visit_rate_per_day: 0.3
  advisory_expiry_steps: 288
  advisory_confirmation_epsilon: 0.05
  tier2_confirmations: 3
  tier3_confirmations: 10

privacy:
  threshold_m: 8
  k_min: 10
  time_window_steps: 12
  epsilon_per_response: 0.1
  randomized_response_p: 0.75
  laplace_scale: 200.0
  dummy_rate: 0.01

attacks:
  active_attacks: []
